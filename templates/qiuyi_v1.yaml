# vessel/voyage 同源合并列「船名/航次」，由 vessel_voyage_split 拆分；族内 6 个指纹为逐年费用列漂移，业务列稳定。
template_id: qiuyi_v1
family: qiuyi
name: 应收对账单·秋怡家族
match:
  fingerprints:
  - 248494ad
  - 2babff58
  - 500ca5db
  - 972efd43
  - ca7df516
  - d90b619c
  family_min_overlap: 0.85
header:
  row_anchor: 序号
  two_row: false
data:
  row_filter: seq_numeric
  stop_on:
  - 合计
fee_boundary: column_range
required:
- bl_no
- box_type_qty
year_source:
- filename
- settlement_row
columns:
  seq: 序号  # 一行一票去重键行序号兜底段（无箱号行）
  biz_no: 业务编号
  order_date: 日期
  customer_name: 客户名称
  customer_contact: 客户联系人
  customer_no: 客户编号
  biz_type: 业务类型
  bl_no: 提单号
  door_point: 门点
  box_type_qty: 箱型
  vessel: 船名/航次
  voyage: 船名/航次
  container_no: 箱号
  pickup_point: 提箱点
  load_point: 装卸点
  return_point: 还箱点
  remark: 备注
normalizers:
  order_date: date_flex
  bl_no: strip_float_tail
  biz_no: strip_float_tail
  box_type_qty: box_parse
  vessel: vessel_voyage_split
  voyage: vessel_voyage_split
# 费用段（T15）：应收对账家族仅应收；mapping 覆盖各年份费用列全集（逐年漂移，
# 缺失列自动跳过）；税金配 import:false 仅参与对账（实测 2018-2020 年存在）；
# 无标准码费目（高速费/掏箱费/搞定箱子/两地装等）走字典 → to_other
fees:
  channels:
    应收: shou
  mapping:
    应收.运费: freight
    应收.待时费: waiting
    应收.预提费: pre_pick
    应收.洋山费: yangshan
    应收.落/还箱费: drop_box
    应收.打/改单费: amend
    应收.超重费: overweight
    应收.港杂费: port_misc
    应收.坏/污箱费: damage_box
    应收.其它费: other
    应收.超期费: overdue
    应收.洋山提: yangshan
    应收.动检费: inspect
    应收.还洋山: yangshan
    应收.预进港: pre_inport
    应收.税金: { code: tax, import: false, reconcile: true }
    应收.过磅费: weigh
    应收.搬移费: move
    应收.理货费: tally
  unmapped_fee: to_other
  anchors:
    应收: [小计]
  fee_defaults:
    price_type: "1"
    is_profit: "1"
    dai_dian: "1"
