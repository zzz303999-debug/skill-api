# 无业务编号/业务日期：归集键用 bl_no；order_date 由 work_date 回落（loader 内置规则，无需配置）。
template_id: junyu_v1
family: junyu
name: 应收对账单·军羽家族
match:
  fingerprints:
  - 2652ad46
  family_min_overlap: 0.85
header:
  row_anchor: 序号
  two_row: false
data:
  row_filter: seq_numeric
  stop_on:
  - 合计
fee_boundary: column_range
required:
- bl_no
- box_type_qty
year_source:
- filename
- settlement_row
columns:
  seq: 序号  # 一行一票去重键行序号兜底段（无箱号行）
  customer_name: 客户名称
  customer_no: 客户编号
  door_point: 门点
  box_type_qty: 箱型箱量
  bl_no: 提单号
  container_no: 箱号
  work_date: 做箱时间
  port_area: 港区
  driver_name: 司机
  remark: 应收备注
normalizers:
  work_date: date_flex
  bl_no: strip_float_tail
  box_type_qty: box_parse
# 费用段（T15）：应收对账家族仅应收；column_range 模式费用列自动发现（columns 未映射
# 列排除锚点/备注），mapping 只负责码解析；无标准码的费目（如有）走字典 → to_other
fees:
  channels:
    应收: shou
  mapping:
    应收.运费: freight
    应收.打/改单费: amend
    应收.其它费: other
  unmapped_fee: to_other
  fee_defaults:
    price_type: "1"
    is_profit: "1"
    dai_dian: "1"
