<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>竞品账单导入</title>
<meta name="description" content="上传竞品应收对账单（xls/xlsx/xlsm），解析归集后一键生成 TMS 订单" />
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e5e5e5;
    --border-strong: #d4d4d4;
    --text: #111111;
    --text-2: #4b4b4b;
    --text-3: #9c9c9c;
    --primary: #111111;
    --primary-hover: #000000;
    --primary-soft: #f4f4f4;
    --success: #111111;
    --success-soft: #f4f4f4;
    --danger: #111111;
    --danger-soft: #f4f4f4;
    --warn: #111111;
    --warn-soft: #f4f4f4;
    --radius: 16px;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px -12px rgba(0, 0, 0, 0.1);
    --shadow-btn: 0 1px 2px rgba(0, 0, 0, 0.12), 0 4px 12px -4px rgba(0, 0, 0, 0.35);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .page {
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }

  /* ---------- 顶部 ---------- */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 32px;
  }

  .brand { display: flex; align-items: center; gap: 14px; }

  .logo {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #333333, #111111);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-btn);
    flex-shrink: 0;
  }

  .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .brand p { font-size: 13px; color: var(--text-3); margin-top: 3px; }

  /* ---------- 卡片 ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 28px;
    margin-bottom: 20px;
  }

  /* ---------- 拖拽区 ---------- */
  .dropzone {
    border: 1.5px dashed var(--border-strong);
    border-radius: 14px;
    padding: 44px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .dropzone:hover, .dropzone.dragging {
    border-color: var(--primary);
    background: var(--primary-soft);
  }

  .dz-icon {
    width: 44px; height: 44px;
    margin: 0 auto 14px;
    border-radius: 12px;
    background: var(--primary-soft);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease;
  }

  .dropzone:hover .dz-icon { transform: translateY(-2px); }

  .dz-title { font-size: 14.5px; color: var(--text-2); }
  .dz-title span { color: var(--primary); font-weight: 600; }
  .dz-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }

  /* ---------- 文件条 ---------- */
  .file-bar {
    display: none;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg);
  }

  .file-bar.show { display: flex; animation: rise 0.25s ease; }

  .file-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--primary-soft);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .file-meta { flex: 1; min-width: 0; }
  .file-name {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-size { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  .file-actions { display: flex; gap: 6px; }

  .btn-ghost {
    padding: 6px 12px;
    font-size: 12.5px;
    font-family: var(--font);
    color: var(--text-2);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-ghost:hover { border-color: var(--border-strong); color: var(--text); }

  .btn-remove {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3);
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 17px;
    transition: all 0.15s ease;
  }

  .btn-remove:hover { background: var(--danger-soft); color: var(--danger); }

  /* ---------- 模式选择 ---------- */
  .mode-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  .seg {
    display: inline-flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
  }

  .seg button {
    padding: 7px 16px;
    font-size: 13px;
    font-family: var(--font);
    font-weight: 500;
    color: var(--text-2);
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .seg button.active {
    background: var(--card);
    color: var(--text);
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.1);
    font-weight: 600;
  }

  .mode-desc { font-size: 12.5px; color: var(--text-3); }

  /* ---------- 提交 ---------- */
  .actions { margin-top: 22px; display: flex; justify-content: flex-end; }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font);
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: var(--shadow-btn);
    transition: all 0.18s ease;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }

  .btn-primary:active:not(:disabled) { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .spinner.hidden { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 结果卡片 ---------- */
  .result-card { display: none; }
  .result-card.show { display: block; animation: rise 0.3s ease; }

  .result-head { display: flex; align-items: flex-start; gap: 14px; }

  .result-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .result-icon.ok, .result-icon.err, .result-icon.warn { background: var(--primary-soft); }

  .result-head h2 { font-size: 16px; font-weight: 700; }
  .result-head p { font-size: 13px; color: var(--text-2); margin-top: 4px; line-height: 1.55; }
  .result-head p code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
  }

  .result-head .err-desc { color: var(--danger); }
  .result-head .warn-desc { color: var(--warn); }

  .detail-block {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.7;
    overflow-wrap: anywhere;
  }

  .detail-block pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    margin-top: 8px;
    color: var(--text-2);
  }

  /* ---------- 统计格 ---------- */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 22px;
  }

  .stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .stat .v { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .stat .v small { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 4px; }
  .stat .k { font-size: 11.5px; color: var(--text-3); margin-top: 4px; font-weight: 500; }

  .stat .v.ok, .stat .v.warn { color: var(--text); }
  .stat .v.dim { color: var(--text-3); }

  /* ---------- 表格 ---------- */
  .table-wrap {
    margin-top: 22px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .table-scroll { overflow-x: auto; max-height: 420px; overflow-y: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }

  thead th {
    position: sticky; top: 0;
    background: var(--bg);
    text-align: left;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.04em;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    white-space: nowrap;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.12s ease; }
  tbody tr:hover { background: #fafafa; }

  .cell-main { font-weight: 600; }
  .cell-sub { color: var(--text-3); font-size: 12px; margin-top: 2px; }
  .cell-dim { color: var(--text-3); }
  .cell-num { font-variant-numeric: tabular-nums; color: var(--text-2); }

  /* 徽章 */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 999px;
  }

  .badge::before {
    content: "";
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  .badge.ok { background: var(--success); color: #ffffff; }
  .badge.err { background: var(--card); color: var(--danger); border: 1px solid var(--border-strong); }
  .badge.pending { background: var(--bg); color: var(--text-3); border: 1px solid var(--border); }

  /* 缺失字段 chips */
  .chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .chip {
    padding: 2px 8px;
    font-size: 11.5px;
    color: var(--text-2);
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    cursor: default;
  }

  .table-empty { padding: 28px; text-align: center; color: var(--text-3); font-size: 13px; }

  /* ---------- 页脚 ---------- */
  footer {
    margin-top: 8px;
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.8;
  }

  @media (max-width: 720px) {
    .page { padding: 28px 16px 48px; }
    header { flex-direction: column; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .mode-row { flex-direction: column; align-items: stretch; }
    .seg { width: 100%; }
    .seg button { flex: 1; }
    .actions { justify-content: stretch; }
    .btn-primary { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="brand">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="8" y1="13" x2="16" y2="13"/>
          <line x1="8" y1="17" x2="13" y2="17"/>
        </svg>
      </div>
      <div>
        <h1>竞品账单导入</h1>
        <p>上传竞品应收对账单，解析归集后一键生成 TMS 订单</p>
      </div>
    </div>
  </header>

  <main>
    <!-- 上传卡片 -->
    <section class="card">
      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="选择账单文件">
        <div class="dz-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <p class="dz-title">拖拽 Excel 账单到此处，或 <span>点击选择文件</span></p>
        <p class="dz-hint">支持 .xls / .xlsx / .xlsm，单个文件</p>
        <input type="file" id="fileInput" accept=".xls,.xlsx,.xlsm" hidden />
      </div>

      <div class="file-bar" id="fileBar">
        <div class="file-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div class="file-meta">
          <p class="file-name" id="fileName"></p>
          <p class="file-size" id="fileSize"></p>
        </div>
        <div class="file-actions">
          <button class="btn-ghost" id="changeBtn" type="button">更换</button>
          <button class="btn-remove" id="removeBtn" type="button" aria-label="移除文件">&times;</button>
        </div>
      </div>

      <div class="mode-row">
        <div class="seg" role="tablist" aria-label="导入模式">
          <button type="button" data-mode="preview" class="active" role="tab">仅预览解析</button>
          <button type="button" data-mode="create" role="tab">解析并创建订单</button>
        </div>
        <p class="mode-desc" id="modeDesc">解析账单并展示归集结果，不触达 TMS 系统</p>
      </div>

      <div class="actions">
        <button class="btn-primary" id="uploadBtn" type="button" disabled>
          <span class="spinner hidden" id="spinner"></span>
          <span id="uploadBtnText">解析账单</span>
        </button>
      </div>
    </section>

    <!-- 结果卡片 -->
    <section class="card result-card" id="resultCard">
      <div class="result-head">
        <div class="result-icon" id="resultIcon"></div>
        <div style="min-width:0">
          <h2 id="resultTitle"></h2>
          <p id="resultDesc"></p>
        </div>
      </div>
      <div id="detailBlock"></div>
      <div class="stat-grid" id="statGrid"></div>
      <div class="table-wrap" id="tableWrap">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>提单号</th>
                <th>客户 / 业务编号</th>
                <th>柜量</th>
                <th>数据行</th>
                <th>缺失字段</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer>
    仅预览模式不会创建任何订单；重复上传已创建过的账单将提示重复导入。
  </footer>
</div>

<script>
(function () {
  "use strict";

  var MAX_SIZE = 20 * 1024 * 1024; // 与后端上传大小限制保持一致

  var state = {
    file: null,
    mode: "preview",
    busy: false,
  };

  var $ = function (sel) { return document.querySelector(sel); };

  var icons = {
    ok: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    err: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    warn: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  };

  /* ---------- 文件选择 ---------- */
  var dropzone = $("#dropzone");
  var fileInput = $("#fileInput");
  var fileBar = $("#fileBar");

  var ACCEPT_RE = /\.(xls|xlsx|xlsm)$/i;

  function setFile(file) {
    if (!file) return;
    if (!ACCEPT_RE.test(file.name)) {
      showError(400, { error: { code: "bad_request", description: "不支持的文件格式，请上传 .xls / .xlsx / .xlsm 账单文件" } });
      return;
    }
    if (file.size > MAX_SIZE) {
      showError(413, { error: { code: "file_too_large", description: "文件超过 20MB 大小限制，请拆分后重试" } });
      return;
    }
    state.file = file;
    $("#fileName").textContent = file.name;
    $("#fileSize").textContent = formatBytes(file.size);
    dropzone.style.display = "none";
    fileBar.classList.add("show");
    $("#uploadBtn").disabled = false;
  }

  function clearFile() {
    state.file = null;
    fileInput.value = "";
    dropzone.style.display = "";
    fileBar.classList.remove("show");
    $("#uploadBtn").disabled = true;
  }

  dropzone.addEventListener("click", function () { fileInput.click(); });
  dropzone.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
  });

  ["dragenter", "dragover"].forEach(function (ev) {
    dropzone.addEventListener(ev, function (e) {
      e.preventDefault();
      dropzone.classList.add("dragging");
    });
  });

  ["dragleave", "drop"].forEach(function (ev) {
    dropzone.addEventListener(ev, function (e) {
      e.preventDefault();
      dropzone.classList.remove("dragging");
    });
  });

  dropzone.addEventListener("drop", function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) setFile(f);
  });

  fileInput.addEventListener("change", function () {
    setFile(fileInput.files[0]);
  });

  $("#changeBtn").addEventListener("click", function () { fileInput.click(); });
  $("#removeBtn").addEventListener("click", clearFile);

  /* ---------- 模式切换 ---------- */
  var MODE_DESC = {
    preview: "解析账单并展示归集结果，不触达 TMS 系统",
    create: "解析后逐单创建 TMS 订单",
  };
  var MODE_BTN = { preview: "解析账单", create: "解析并创建订单" };

  document.querySelectorAll(".seg button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".seg button").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      state.mode = btn.dataset.mode;
      $("#modeDesc").textContent = MODE_DESC[state.mode];
      $("#uploadBtnText").textContent = MODE_BTN[state.mode];
    });
  });

  /* ---------- 上传 ---------- */
  $("#uploadBtn").addEventListener("click", upload);

  function apiUrl() {
    return "/orders/bill/import";
  }

  async function upload() {
    if (state.busy || !state.file) return;
    state.busy = true;

    var btn = $("#uploadBtn");
    btn.disabled = true;
    $("#spinner").classList.remove("hidden");
    var label = $("#uploadBtnText");
    label.textContent = state.mode === "create" ? "正在创建订单…" : "正在解析…";
    hideResult();

    var fd = new FormData();
    fd.append("file", state.file);
    if (state.mode === "create") fd.append("create_order", "true");

    try {
      var res = await fetch(apiUrl(), { method: "POST", body: fd });
      var data = null;
      try { data = await res.json(); } catch (e) { /* 非 JSON 响应 */ }

      if (res.ok && data && !data.error && (data.code === "200" || data.code === undefined)) {
        // v2.2 统一外壳：成功时业务数据在 data.data；兼容旧后端成功响应（无 code 键），
        // 避免后端先上线/HTML 缓存窗口期把成功误渲染为「导入失败」（审查修正 2026-08-27）
        renderResult(data.code === "200" ? data.data : data);
      } else if (data && !data.error && data.code === "204") {
        // 业务全部失败：仍渲染失败明细，标题显示具体原因（msg 可直接展示）
        renderResult(data.data);
        showResult("err", "导入失败", '<span class="err-desc">' + esc(data.msg || "添加失败") + "</span>");
      } else {
        showError(res.status, data);
      }
    } catch (e) {
      showError(0, { error: { code: "network_error", description: "无法连接服务，请确认页面与服务同源部署、服务已启动" } });
    } finally {
      state.busy = false;
      btn.disabled = false;
      $("#spinner").classList.add("hidden");
      label.textContent = MODE_BTN[state.mode];
    }
  }

  /* ---------- 结果渲染 ---------- */
  var resultCard = $("#resultCard");

  function hideResult() {
    resultCard.classList.remove("show");
  }

  function showResult(kind, title, descHtml) {
    $("#resultIcon").className = "result-icon " + kind;
    $("#resultIcon").innerHTML = icons[kind];
    $("#resultTitle").textContent = title;
    $("#resultDesc").innerHTML = descHtml;
    resultCard.classList.add("show");
    resultCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function renderResult(data) {
    var rows = (data.orders && data.orders.length) ? data.orders : (data.canonical_orders || []);
    var isCanonical = !(data.orders && data.orders.length);

    $("#detailBlock").innerHTML = "";
    $("#statGrid").innerHTML = "";
    $("#tableBody").innerHTML = "";
    $("#tableWrap").style.display = "";

    // 头部
    var isCreate = data.create_order && data.summary;
    var headDesc = isCreate ? renderSummaryDesc(data.summary) : "解析完成，共归集 " + data.order_count + " 笔订单，均未创建";
    showResult("ok", isCreate ? "创建完成" : "解析完成", esc(data.file) + " · " + headDesc);

    // 统计格
    var stats = [
      { k: "结算区间", v: esc(data.bill_period || "—"), small: "" },
      { k: "数据行数", v: String(data.total_rows ?? 0), small: "行" },
      { k: "归集订单", v: String(data.order_count ?? 0), small: "笔" },
    ];
    if (isCreate) {
      var s = data.summary || {};
      stats.push({
        k: "创建结果",
        v: String(s.created ?? 0),
        small: "新建 / 跳过 " + (s.skipped ?? 0) + " / 失败 " + (s.failed ?? 0),
        cls: (s.failed ? "warn" : "ok"),
      });
    } else {
      stats.push({ k: "创建模式", v: "未开启", small: "仅预览", cls: "dim" });
    }

    $("#statGrid").innerHTML = stats.map(function (st) {
      return '<div class="stat"><div class="v' + (st.cls ? " " + st.cls : "") + '">' + st.v +
        (st.small ? "<small>" + st.small + "</small>" : "") +
        '</div><div class="k">' + st.k + "</div></div>";
    }).join("");

    // 表格
    if (!rows.length) {
      // 空态渲染进现有 tbody 行，保留 tableWrap 内部结构，
      // 否则 #tableBody 被移除后二次渲染会空指针崩溃
      $("#tableBody").innerHTML =
        '<tr><td colspan="6" class="table-empty">未识别到有效订单数据，请检查账单内容或模板配置</td></tr>';
      return;
    }

    $("#tableBody").innerHTML = rows.map(function (row) {
      return "<tr>" + renderRowCells(row, isCanonical) + "</tr>";
    }).join("");
  }

  function renderRowCells(row, isCanonical) {
    var main, sub, boxCount, rowCount, missing = row.missing_fields || [], status;

    if (isCanonical) {
      main = row.bl_no || "—";
      sub = [row.customer_name, row.biz_no].filter(Boolean).join(" · ") || "—";
      var boxes = (row.box_groups || []).map(function (g) {
        return (g.b_type || "?") + "×" + (g.box_num ?? 1);
      });
      boxCount = boxes.join(", ") || "—";
      rowCount = "—";
    } else {
      main = row.order_num1 || "—";
      sub = row.c_title || "—";
      boxCount = row.container_count ?? "—";
      rowCount = String(row.row_count ?? 0);
    }

    if (row.create_result) {
      // error 为对象（code/message/description/details），tooltip 展示 message（可直接读）
      var errMsg = (row.create_result.error && row.create_result.error.message) || "";
      status = row.create_result.success
        ? '<span class="badge ok" title="业务编号：' + esc(row.create_result.sn || "") + '">成功</span>'
        : '<span class="badge err" title="' + esc(errMsg) + '">失败</span>';
    } else {
      status = '<span class="badge pending">待创建</span>';
    }

    var missingHtml = missing.length
      ? '<span class="chips">' + missing.slice(0, 2).map(function (f) {
          var reason = row.missing_reasons && row.missing_reasons[f];
          return '<span class="chip" title="' + esc(reason || f) + '">' + esc(f) + "</span>";
        }).join("") + (missing.length > 2 ? '<span class="chip">+' + (missing.length - 2) + "</span>" : "") + "</span>"
      : '<span class="cell-dim">—</span>';

    return '<td><div class="cell-main">' + esc(main) + "</div>" +
      '<div class="cell-sub">' + esc(sub) + "</div></td>" +
      '<td class="cell-num">' + esc(String(boxCount)) + "</td>" +
      '<td class="cell-num">' + rowCount + "</td>" +
      "<td>" + missingHtml + "</td>" +
      "<td>" + status + "</td>";
  }

  function renderSummaryDesc(s) {
    if (!s) return "";
    return "共 " + (s.total ?? 0) + " 笔，" +
      "新建 " + (s.created ?? 0) + "，跳过 " + (s.skipped ?? 0) + "，失败 " + (s.failed ?? 0);
  }

  /* ---------- 错误渲染 ---------- */
  function showError(status, data) {
    // v2.2 统一外壳 {code, msg, data}（账单录入错误场景）；兼容旧 {error: {...}} 结构
    var err = (data && data.error) || {};
    var code = err.code || (data && data.code) || (status ? "HTTP " + status : "网络错误");
    var desc = err.description || err.message || (data && data.msg) || "发生未知错误，请稍后重试";
    var details = err.details || (data && data.data) || null;

    $("#statGrid").innerHTML = "";
    $("#tableBody").innerHTML = "";
    $("#tableWrap").style.display = "none";

    // 409 重复导入：琥珀警示 + 已创建单号（统一外壳 code="409"，明细在 data.summary）
    if (code === "409" || code === "duplicate_bill") {
      var d = (details && details.summary) || details || {};
      var sns = d.success_sns || [];
      var listHtml = sns.length
        ? "<div class=\"detail-block\">本次未创建新订单，以下业务编号此前已创建成功：" +
          "<pre>" + esc(sns.join("\n")) + "</pre></div>"
        : '<div class="detail-block">本次未创建新订单，全部账单此前已创建成功</div>';
      $("#detailBlock").innerHTML = listHtml;
      showResult("warn", "账单已全部创建过", "重复导入 · <code>" + esc(code) + "</code>");
      return;
    }

    var detailsHtml = "";
    if (details) {
      detailsHtml = '<div class="detail-block">技术详情：<pre>' + esc(JSON.stringify(details, null, 2)) + "</pre></div>";
    }
    $("#detailBlock").innerHTML = detailsHtml;
    showResult("err", "导入失败", '<span class="err-desc">' + esc(desc) + '</span><br><code>' + esc(code) + "</code>");
  }

  /* ---------- 工具 ---------- */
  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
})();
</script>
</body>
</html>
