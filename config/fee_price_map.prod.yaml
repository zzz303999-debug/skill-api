# 标准费目码 → TMS 费目/price_id 映射表（生产环境）
# 结构同 test 环境；生产价格表到位后整表补 price_id，tms_name 以生产价格表为准（名称可能不同）。
# 缺本文件/加载失败 → 启动 fail fast（不允许裸跑）；补值只改 YAML，零代码。
# 2026-08-31 起 5 个实证 id 自 test 表同步（同一 TMS，price_id 全局唯一跨通道通用）：
# 不补则这 5 项主力费目因自举从未建档（yaml 优先命中）在 registry 无兜底 → 录不进。
freight:     { tms_name: 运费,     price_id: 820 }     # 实证（下单抓包+EX26081252）
pre_pick:    { tms_name: 预提费,   price_id: 121744 }  # 实证（跨通道同 id 复用）
fuel:        { tms_name: 油费,     price_id: 1134 }    # 实证（get/pay/supplier 三通道同现）
trip:        { tms_name: 出车费,   price_id: 821 }     # 实证
hijack:      { tms_name: 打劫费,   price_id: 1135 }    # 实证；竞品样本中未出现，先登记防长尾撞上
waiting:     { tms_name: 待时费,   price_id: null }
pre_inport:  { tms_name: 预进港,   price_id: null }
drop_box:    { tms_name: 落箱费,   price_id: null }
amend:       { tms_name: 打单费,   price_id: null }
yangshan:    { tms_name: 洋山费,   price_id: null }
damage_box:  { tms_name: 坏污箱费, price_id: null }
overdue:     { tms_name: 超期费,   price_id: null }
overweight:  { tms_name: 超重费,   price_id: null }
inspect:     { tms_name: 动检费,   price_id: null }
weigh:       { tms_name: 过磅费,   price_id: null }
tally:       { tms_name: 理货费,   price_id: null }
move:        { tms_name: 搬移费,   price_id: null }
lift:        { tms_name: 上下车费, price_id: null }
port_misc:   { tms_name: 港杂费,   price_id: null }
tax:         { tms_name: 税金,     price_id: null, import: false }
other:       { tms_name: 其它费,   price_id: null }
crane:       { tms_name: 吊机费,   price_id: null }      # 2026-08-31 自举实弹验证用（AddCarPrice 建档链路）

# 费目自举（T24/T25）：生产默认关闭——价格表由 运维管控，自举属越权行为，需显式开启。
# 2026-08-31 用户拍板：开启生产自举（懒创建 + registry 幂等 + 204 已存在标记外部
# exists_external 不再重试 + 失败降级不阻塞下单，风险受控）；结构已与 test 对齐。
fee_bootstrap:
  enabled: true
  endpoint_key: price_create
  create_defaults:
    sn_prefix: AUTO
    inout: "3"
    is_get: on
    is_pay: on
    price_type: "1"
    is_profit: "1"
    status: "1"
    dai_dian: "2"
    bao_zhang: "1"
    od: "0"
    use_imprest: "0"
    expense_rate: "5"
    class_id: "4612"
    classification_name: 运费
