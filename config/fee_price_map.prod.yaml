# 标准费目码 → TMS 费目映射表（生产环境）
# 条目级只保留业务定义（tms_name/import，全局共享无归属语义）；price_id 是
# 归属敏感的 TMS 档案主键，按账号配在 owner_price_ids 段（2026-09-08 用户拍板：
# 费目全链按 sk 隔离，废除全局显式 id——订单费用只挂自己账号名下的档案）。
# 缺本文件/加载失败 → 启动 fail fast（不允许裸跑）；补值只改 YAML，零代码。
# owner_price_ids 键 = owner_key(sk) = sha256(sk) 前 16 hex（查询：python
# scripts/fee_owner_key.py <sk>）；该账号在 TMS 已有档案时预置，首传直接命中
# 不重建；未列出的 owner 首传触发自举建档（挂自己账号）。
freight:     { tms_name: 运费 }
pre_pick:    { tms_name: 预提费 }
fuel:        { tms_name: 油费 }
trip:        { tms_name: 出车费 }
hijack:      { tms_name: 打劫费 }   # 竞品样本中未出现，先登记防长尾撞上
waiting:     { tms_name: 待时费 }
pre_inport:  { tms_name: 预进港 }
drop_box:    { tms_name: 落箱费 }
amend:       { tms_name: 打单费 }
yangshan:    { tms_name: 洋山费 }
damage_box:  { tms_name: 坏污箱费 }
overdue:     { tms_name: 超期费 }
overweight:  { tms_name: 超重费 }
inspect:     { tms_name: 动检费 }
weigh:       { tms_name: 过磅费 }
tally:       { tms_name: 理货费 }
move:        { tms_name: 搬移费 }
lift:        { tms_name: 上下车费 }
port_misc:   { tms_name: 港杂费 }
tax:         { tms_name: 税金 }     # 2026-09-01 用户拍板：账单中的税金照录（原 import:false 仅对账作废）
other:       { tms_name: 其它费 }   # to_other 长尾归并目标（is_other=1）
# crane（吊机费）未列：TMS 尚无此费目；账单中的吊机费自动归「其它费」照录。

# per-owner 显式 price_id（原条目级全局 id 迁移，2026-09-08 owner 化）：
# a8cf118e298903d2 = 15478（章家俊）——2026-08-14 自举建档的那批档案在其名下
# （sn=AUTO_* 前缀；5 项主力费目为更早抓包实证 id）。2026-09-08 sk 轮换后
# owner 键由 24f98255fd1066a9 迁移至此；预置后其首传直接命中，不重建不撞名；
# sk 再轮换时同步迁移本段键（或改走 registry 直写认领，见
# scripts/migrate_fee_registry_owners.py --to-owner）。
# default = 无 sk 槽：建档只发生在 create（无 sk 已被 400 拦截），default 只被
# 只读 preview 消费——配全套 id 保无 sk preview 与 create 预测一致（2026-09-08
# 审查确认无建档副作用；与 test 表同值）。
owner_price_ids:
  "default":
    freight: 820
    pre_pick: 121744
    fuel: 1134
    trip: 821
    hijack: 1135
    waiting: 124844
    pre_inport: 124834
    drop_box: 124843
    amend: 124839
