# 费目自举
fee_bootstrap:
  enabled: true
  endpoint_key: price_create
  create_defaults:
    sn_prefix: AUTO
    inout: "3"
    is_get: on
    is_pay: on
    price_type: "1"
    is_profit: "1"
    status: "1"
    dai_dian: "2"
    bao_zhang: "1"
    od: "0"
    use_imprest: "0"
    expense_rate: "5"
    class_id: "4612"
    classification_name: 运费
