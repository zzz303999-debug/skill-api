# 标准费目码 → TMS 费目映射表（生产环境）。
# price_id 归属敏感，按账号配在 owner_price_ids：键 = sha256(sk) 前 16 hex
# （查询：python scripts/fee_owner_key.py <sk>）；未列出的 owner 首传触发自举建档。
# 缺本文件/加载失败 → 启动 fail fast；补值只改 YAML，零代码。
freight:     { tms_name: 运费 }
pre_pick:    { tms_name: 预提费 }
fuel:        { tms_name: 油费 }
trip:        { tms_name: 出车费 }
hijack:      { tms_name: 打劫费 }
waiting:     { tms_name: 待时费 }
pre_inport:  { tms_name: 预进港 }
drop_box:    { tms_name: 落箱费 }
amend:       { tms_name: 打单费 }
yangshan:    { tms_name: 洋山费 }
damage_box:  { tms_name: 坏污箱费 }
overdue:     { tms_name: 超期费 }
overweight:  { tms_name: 超重费 }
inspect:     { tms_name: 动检费 }
weigh:       { tms_name: 过磅费 }
tally:       { tms_name: 理货费 }
move:        { tms_name: 搬移费 }
lift:        { tms_name: 上下车费 }
port_misc:   { tms_name: 港杂费 }
tax:         { tms_name: 税金 }     # 账单税金照录
other:       { tms_name: 其它费 }   # to_other 长尾归并目标（is_other=1）
# crane（吊机费）未列（TMS 无此费目）：自动归「其它费」照录。

# per-owner 显式 price_id；预置后该账号首传直接命中，不重建。
# sk 轮换后同步迁移本段键（或走 registry 直写认领：
# scripts/migrate_fee_registry_owners.py --to-owner）。
# 无 sk 已被 create 拦截、preview 为只读无归属（owner=None）——default 槽无消费
# 路径，不配置（2026-09-11 清理）。
owner_price_ids:
  "a8cf118e298903d2":
    freight: 820
    pre_pick: 121744
    fuel: 1134
    trip: 821
    hijack: 1135
    waiting: 124844
    pre_inport: 124834
    drop_box: 124843
    amend: 124839
    yangshan: 124833
    damage_box: 124836
    overdue: 124845
    overweight: 124838
    inspect: 124837
    weigh: 124842
    tally: 124835
    move: 124841
    lift: 124840
    port_misc: 124846
    tax: 125466
    other: 124832

# 费目自举：缺失费目码懒创建并登记 id（按 owner 槽）。
fee_bootstrap:
  enabled: true
  endpoint_key: price_create
  create_defaults:
    sn_prefix: AUTO
    inout: "3"
    is_get: on
    is_pay: on
    price_type: "1"
    is_profit: "1"
    status: "1"
    dai_dian: "2"
    bao_zhang: "1"
    od: "0"
    use_imprest: "0"
    expense_rate: "5"
    class_id: "4612"
    classification_name: 运费
