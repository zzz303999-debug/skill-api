    port_misc: 124846
    tax: 125466
    other: 124832
  "a8cf118e298903d2":
    freight: 820        # 实证（下单抓包+EX26081252）
    pre_pick: 121744    # 实证（跨通道同 id 复用）
    fuel: 1134          # 实证（get/pay/supplier 三通道同现）
    trip: 821           # 实证
