yangshan:       [洋山费, 洋山提, 还洋山, 洋山提空箱, 空箱还洋山, 洋山提空, 空还洋山]
damage_box:     [坏/污箱费, 坏污箱, 坏污箱费, 污箱费, 船公司坏污箱费]
overdue:        [超期费, 超期用箱费]
overweight:     [超重费]
inspect:        [动检费, 动检掏箱费, 动植场地费, 动检场地费]
