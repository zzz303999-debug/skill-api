# 费目别名字典（全局，L3/新家族冷启动：费目名 → 标准费目码）
# 与 templates/alias_dictionary.yaml（字段别名字典）互不冲突：本文件只服务费用归一化。
# 新家族接入时先在模板 fees.mapping 显式映射；未覆盖的费目列按本字典反查。
# 补值/加费目 = 改 YAML，零代码。
freight:        [运费]
waiting:        [待时费]
pre_pick:       [预提费]
pre_inport:     [预进港]
drop_box:       [落箱费, 落/还箱费, 落还箱费]
