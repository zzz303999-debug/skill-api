# 基础资料阈值建档配置——生产环境（APP_ENV=prod 时加载）。
# 与 test 双份随镜像分发，APP_ENV 决定加载哪份（环境切换零 Git 改动）。
# 累计出现次数 > threshold 才建档（订单/费用照常录入，不阻塞）：
# 客户=归一名；工厂=名+地址；司机+车辆=司机名+车牌；跨全部模板家族累计，
# 达阈值当批建档、当批回填。
# 档案类 endpoint 为 TODO/空 → 该档案类降级为只计数不建档（端点是运维补给，不 fail fast）。
# 分组/部门/业务员等默认值全部在本文件配置，代码不硬编码。
master_data:
  enabled: true
  threshold: 5
  # 建档撞唯一约束时 msg 命中任一标记 → 视为「外部已存在」（exists_external），
  # 登记后不再重试建档（配置化匹配串，不写死单串）。
  duplicate_markers:
  - 已存在
  - Duplicate entry
  - 重复
  # 建档编码前缀（sn = {prefix}{5 位序号}，序号取该键累计计数，防存量撞名）。
  sn_prefix:
    client: CLT
    factory: FAC
    bailor: BAL
    truck: TRK
    driver: DRV
  # 建档端点按全量 URL 直发（建档族与订单不同宿主，不拼 base、不写死 host）。
  # bailor_create 保持 TODO：委托人本阶段只计数不建档。
  endpoints:
    client_create: "https://s3.jxt56.com/Car/CarClient/AddCarClient"
    factory_create: "https://s3.jxt56.com/Car/CarFactory/AddCarFactory"
    bailor_create: "TODO"
    truck_create: "https://s3.jxt56.com/Car/CarTruck/AddCarTruck"
    driver_create: "https://s3.jxt56.com/Car/CarDriver/AddCarDriver"
    price_create: "https://s3.jxt56.com/Car/CarPrice/AddCarPrice"
  # 建档默认值（未配键不发送）；归属键（su_id/remind_id 等）由 TMS 按 sk 会话自动分发，不得写死。
  defaults:
    client:  { cg_id: "4", cg_name: 同行, sys_type: "1" }
    truck:   { section_id: "6987", sys_type: "1", type: bill }
    driver:  { sinout: 自做, sys_type: "1" }
    factory: { sys_type: "1" }
    bailor:  { sys_type: "1", is_involve: "1", is_quoted: "0" }
