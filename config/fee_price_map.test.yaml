# 标准费目码 → TMS 费目映射表（测试环境）。
# price_id 归属敏感，按账号配在 owner_price_ids：键 = sha256(sk) 前 16 hex
# （查询：python scripts/fee_owner_key.py <sk>）。
# 环境切换只换文件（config/fee_price_map.{env}.yaml），代码零环境名。
freight:     { tms_name: 运费 }
pre_pick:    { tms_name: 预提费 }
fuel:        { tms_name: 油费 }
trip:        { tms_name: 出车费 }
hijack:      { tms_name: 打劫费 }
waiting:     { tms_name: 待时费 }
pre_inport:  { tms_name: 预进港 }
drop_box:    { tms_name: 落箱费 }
amend:       { tms_name: 打单费 }
yangshan:    { tms_name: 洋山费 }
damage_box:  { tms_name: 坏污箱费 }
overdue:     { tms_name: 超期费 }
overweight:  { tms_name: 超重费 }
inspect:     { tms_name: 动检费 }
weigh:       { tms_name: 过磅费 }
tally:       { tms_name: 理货费 }
move:        { tms_name: 搬移费 }
lift:        { tms_name: 上下车费 }
port_misc:   { tms_name: 港杂费 }
tax:         { tms_name: 税金 }     # 账单税金照录
other:       { tms_name: 其它费 }   # to_other 长尾归并目标（sn=AUTO_OTHER）
deduction:   { tms_name: 扣除费 }   # 负向扣减项（应付区）

# per-owner 显式 price_id；预置后该账号首传直接命中，不重建；
# sk 重新登录后 owner_key 变化需同步迁移本段键。
# default = 无 sk 直调槽（测试直调/pytest 路径）：预置全套 id 保持既有测试行为；
# 生产不配 default（无 sk 是异常路径，降级不建）。
