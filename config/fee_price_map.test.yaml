# 标准费目码 → TMS 费目/price_id 映射表（测试环境，2026-08-13 起建）
# price_id 全局唯一、跨通道通用（EX26081252/EX26080031 双重实证），单表服务应收/应付/成本三通道。
# price_id: null = 待补（outerHTML / 客服导出补值，补值不改代码）。
# 环境切换只换文件（config/fee_price_map.{env}.yaml），代码零环境名。
freight:     { tms_name: 运费,     price_id: 820 }      # 实证（下单抓包+EX26081252）
pre_pick:    { tms_name: 预提费,   price_id: 121744 }   # 实证（跨通道同 id 复用实证）
fuel:        { tms_name: 油费,     price_id: 1134 }     # 实证（get/pay/supplier 三通道同现）
trip:        { tms_name: 出车费,   price_id: 821 }      # 实证
hijack:      { tms_name: 打劫费,   price_id: 1135 }     # 实证；竞品样本中未出现，先登记防长尾撞上
waiting:     { tms_name: 待时费,   price_id: 124844 }
pre_inport:  { tms_name: 预进港,   price_id: 124834 }
drop_box:    { tms_name: 落箱费,   price_id: 124843 }     # 落/还箱费同目
amend:       { tms_name: 打单费,   price_id: 124839 }
yangshan:    { tms_name: 洋山费,   price_id: 124833 }
damage_box:  { tms_name: 坏污箱费, price_id: 124836 }
overdue:     { tms_name: 超期费,   price_id: 124845 }
overweight:  { tms_name: 超重费,   price_id: 124838 }
inspect:     { tms_name: 动检费,   price_id: 124837 }
weigh:       { tms_name: 过磅费,   price_id: 124842 }
tally:       { tms_name: 理货费,   price_id: 124835 }
move:        { tms_name: 搬移费,   price_id: 124841 }
lift:        { tms_name: 上下车费, price_id: 124840 }
port_misc:   { tms_name: 港杂费,   price_id: 124846 }
tax:         { tms_name: 税金,     price_id: 125466 }  # 2026-09-01 与 prod 对齐：税金照录
other:       { tms_name: 其它费,   price_id: 124832 }  # to_other 长尾归并目标（sn=AUTO_OTHER）
deduction:    { tms_name: 扣除费,   price_id: 124850 }  # T27a 负向扣减项（赢辉应付区）

# 费目自举（T24/T25）：缺失费目码在导入命中时懒创建并登记 id；表内 id 已全量补齐，此段为新增未知费目时的兜底。
fee_bootstrap:
  enabled: true
  endpoint_key: price_create
  create_defaults:         
    sn_prefix: AUTO
    inout: "3"
    is_get: on
    is_pay: on
    price_type: "1"
    is_profit: "1"
    status: "1"
    dai_dian: "2"
    bao_zhang: "1"
    od: "0"
    use_imprest: "0"
    expense_rate: "5"
    class_id: "4612"           # 费类=运费（测试环境实证）；其它类待费类表到位后细分
    classification_name: 运费
