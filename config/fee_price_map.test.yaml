# 费目自举：缺失费目码在导入命中时懒创建并登记 id（按 owner 槽）；
# 显式段已预置存量账号，此段为新增未知费目时的兜底。
fee_bootstrap:
  enabled: true
  endpoint_key: price_create
  create_defaults:
    sn_prefix: AUTO
    inout: "3"
    is_get: on
    is_pay: on
    price_type: "1"
    is_profit: "1"
    status: "1"
    dai_dian: "2"
    bao_zhang: "1"
    od: "0"
    use_imprest: "0"
    expense_rate: "5"
    class_id: "4612"           # 费类=运费（其它类待费类表到位后细分）
    classification_name: 运费
