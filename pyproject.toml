[project]
name = "skill-api"
version = "0.1.0"
description = "Multi-skill extraction API service backed by OpenClaw gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "openai>=1.54.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "python-docx>=1.1.2",
    "pdfplumber>=0.11.4",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/._*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "golden: calls the configured LLM gateway against all pinned golden cases",
    "mineru_golden: calls MinerU and diffs its raw parsed output",
]
