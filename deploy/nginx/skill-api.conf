# skill-api 反向代理模板（HTTPS，Let's Encrypt / certbot 自动签发）
#
# 使用方法（certbot 自动签发，证书自动续期）：
#   1. 将两处 server_name 的 skill-api.example.com 替换为真实域名
#   2. 安装 certbot 并签发（自动修改本配置并 reload nginx）：
#        dnf install -y certbot python3-certbot-nginx
#        certbot --nginx -d 你的域名 --redirect
#      certbot 会自动写入证书路径（/etc/letsencrypt/live/<域名>/）、
#      启用 443 并把 80 改为 301 跳转；续期由 certbot.timer 自动完成
#   3. 将本文件复制到 /etc/nginx/conf.d/skill-api.conf 后 nginx -t && systemctl reload nginx
#   4. 云安全组对公网只开放 80/443；9000 已由 docker-compose.deploy.yml 绑定到 127.0.0.1
#
# 注意：
# - 首次签发前 80 端口必须可访问（HTTP-01 验证），以下 80 块已放行验证路径
# - X-Forwarded-For 使用 $proxy_add_x_forwarded_for（追加语义），
#   与服务端取 XFF 最后一个地址的信任逻辑一致，客户端无法伪造真实 IP
# - client_max_body_size 必须与 API_MAX_UPLOAD_BYTES 保持一致

server {
    listen 80;
    server_name skill-api.example.com;

    # HTTP-01 验证目录（certbot --webroot 方式验证用；--nginx 插件同样需要 80 可达）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 证书签发后自动 301 跳转；certbot --redirect 会生成如下跳转规则：
    # location / {
    #     return 301 https://$host$request_uri;
    # }
}

